name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package yandex_generative_ai_conversation.zip
        run: |
          cd custom_components/yandex_generative_ai_conversation
          zip -r "${GITHUB_WORKSPACE}/yandex_generative_ai_conversation.zip" . -x "*/__pycache__/*" "*.pyc" "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: yandex_generative_ai_conversation.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') }}
