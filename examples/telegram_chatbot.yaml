# Умный чат-бот Telegram (официальная интеграция telegram_bot, схема Home Assistant 2026+)
# - В личном чате (chat_id > 0): отвечает сразу на текст и фотографии.
# - В группе (chat_id < 0): отвечает только при обращении "Бот190" / "бот 190".

alias: 'Telegram: Умный чат-бот Yandex AI Studio (текст и фото)'
description: '100% визуальные UI-блоки HA 2026+: выберите своего уведомителя Telegram и агента Yandex AI мышкой'
triggers:
  - trigger: event
    event_type: telegram_text
    id: text_msg
  - trigger: event
    event_type: telegram_attachment
    id: photo_msg
conditions:
  - condition: template
    value_template: '{{ trigger.event.data.user_id in [111222333, 444555666] }}'
actions:
  - variables:
      raw_text: >-
        {{ (trigger.event.data.text | default(trigger.event.data.caption | default(''))) | trim }}
      clean_text: >-
        {{ raw_text | regex_replace(find='^/?бот\s*190\b[,:\s-]*', replace='', ignorecase=True) | trim }}
      has_photo: >-
        {{ trigger.id == 'photo_msg'
           and (trigger.event.data.file_mime_type | default('image/jpeg')).startswith('image/') }}
  - action: telegram_bot.send_chat_action
    data:
      entity_id:
        - notify.telegram_bot_my_chat
      chat_action: typing
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ has_photo }}'
        sequence:
          - action: telegram_bot.download_file
            data:
              file_id: '{{ trigger.event.data.file_id }}'
            response_variable: tg_dl
          - action: conversation.process
            data:
              agent_id: conversation.yandex_ai_conversation
              text: '{{ (clean_text ~ " [image: " ~ tg_dl.file_path ~ "]") | trim }}'
              conversation_id: 'tg_{{ trigger.event.data.chat_id }}'
            response_variable: ai_answer
    default:
      - action: conversation.process
        data:
          agent_id: conversation.yandex_ai_conversation
          text: '{{ clean_text }}'
          conversation_id: 'tg_{{ trigger.event.data.chat_id }}'
        response_variable: ai_answer
  - if:
      - condition: template
        value_template: '{{ ai_answer.response.speech.plain.speech is defined }}'
    then:
      - action: telegram_bot.send_message
        data:
          entity_id:
            - notify.telegram_bot_my_chat
          message: '{{ ai_answer.response.speech.plain.speech }}'
          parse_mode: plain_text
mode: queued
max: 5
